      mc('操作系统对应用最重要的作用是什么？',['让应用直接修改所有硬件','提供抽象与接口，并管理、共享和隔离资源','替代 CPU 执行所有指令','只负责显示桌面'],1,'OS 承上启下：向上提供抽象和服务，向下管理资源、实现保护与隔离。',2),
      mc('硬件判断能否执行某条特权指令，主要依据什么？',['当前 CPU 特权级','程序窗口大小','用户是否双击了图标','文件是不是 PDF'],0,'硬件检查执行代码时的特权级。root 启动的普通程序通常仍运行在用户态。',14),
      mc('应用主动请求内核服务，通常经过哪种受控入口？',['普通变量赋值','随意跳到内核地址','系统调用','重新启动计算机'],2,'应用按约定设置调用号与参数，再通过系统调用指令进入受控内核入口。',23),
      mc('微内核将更多服务放在用户态，主要带来哪种取舍？',['完全不需要内核','隔离和模块化更好，但可能增加通信开销','所有服务都无需通信','必然比所有宏内核更快'],1,'微内核以更多消息交互与边界穿越换取模块化和故障隔离。',37),
      tf('管理员启动的普通应用，可以不经过内核直接执行任何特权指令。',false,'用户身份权限和 CPU 特权级不同。管理员应用也不能任意绕过用户态限制。',12),
      tf('发生一次用户态到内核态切换，就必然切换到另一个进程。',false,'模式切换不等于进程切换；内核可以继续代表当前进程完成系统调用。',27),
      tf('每次调用 malloc，都必然发生一次系统调用。',false,'分配器可以从已取得的内存中分配小块，只有必要时才向内核请求更多空间。',34),
      tf('磁盘完成 I/O 后产生的中断，与 CPU 当前执行的指令通常没有直接因果关系。',true,'外部硬件中断是异步事件；同步异常则由当前指令执行引起。',20),
      fill('负责在启动过程中加载内核的引导程序，常称为 ____。',['bootloader','boot loader','引导加载程序','引导加载器'],'固件先运行初始代码，再由 Bootloader 加载和移交控制给内核。',7),
      fill('能够修复后重新执行故障指令的异常类型，课件称为 ____。',['fault','出错'],'Fault 如可修复缺页，处理后可重试导致异常的指令。',22),
      fill('应用请求操作系统服务的受控接口称为 ____。',['系统调用','system call','syscall'],'系统调用跨越保护边界，不能等同于普通的用户态函数调用。',27),
      fill('规定二进制调用时参数、返回值和寄存器使用约定的规范，简称 ____。',['ABI','应用程序二进制接口'],'ABI 约定二进制交互规则；还需要相应指令集、平台和运行库才能兼容。',31)
    ],
    [
      mc('哪个结构是进程在内核中的主要管理表示？',['CPU Cache','PCB','屏幕缓冲区','源代码注释'],1,'PCB 保存或关联进程状态、标识、寄存器上下文和资源信息。',17),
      mc('exec 成功执行后，通常会发生什么？',['新增一个子进程','原程序一定继续执行下一行','当前进程映像被替换','复制所有硬盘文件'],2,'exec 替换当前进程的程序映像，成功时不返回；本身不创建新 PID。',34),
      mc('阻塞进程等待的 I/O 已完成，被唤醒后通常先进入哪个状态？',['运行','退出','创建','就绪'],3,'唤醒只是使其有资格竞争 CPU，被调度后才进入运行态。',26),
      mc('malloc 返回的动态内存，典型情况下属于哪一类区域？',['代码段','堆或动态映射区','只读字符串区','CPU 指令寄存器'],1,'堆用于动态分配；实际分配器对大块内存也可能采用独立映射。',14),
      tf('fork 的写时复制意味着子进程修改普通私有变量时，父进程会自动看到新值。',false,'父子具有逻辑上独立的地址空间。COW 可以初始共享物理页面，写入时再分离。',34),
      tf('每次上下文切换，都需要把进程全部内存保存到磁盘。',false,'上下文切换主要保存恢复寄存器与执行状态，不等于将全部内存换出。',31),
      tf('就绪进程具备运行条件，只是在等待 CPU。',true,'就绪与阻塞的区别是：就绪主要缺 CPU；阻塞是在等待事件或资源。',28),
      tf('ELF 的 segment 偏向装载视图，section 偏向链接视图。',true,'程序头描述装载用段，节表描述链接时按逻辑组织的各节。',10),
      fill('进程控制块的英文缩写是 ____。',['PCB'],'Process Control Block，是进程在内核中的管理表示。',17),
      fill('UNIX 中创建子进程的典型系统调用是 ____。',['fork','fork()'],'fork 成功后父子分别从返回处继续，返回值不同。',34),
      fill('父进程等待并回收子进程退出状态，常用 ____ 或 waitpid。',['wait','wait()'],'wait 不只是让子进程先运行，它还用于收集退出信息。',35),
      fill('运行中的进程时间片用完，被抢占后通常回到 ____ 态。',['就绪','ready'],'时间片结束时任务通常仍具备执行条件，重新排队等待 CPU。',24)
    ],
    [
      mc('同一进程内的线程通常共享什么？',['同一个 PC 的实时值','整个地址空间和打开文件等资源','同一个栈指针的值','同一份独立寄存器现场'],1,'线程共享进程资源，同时各有执行上下文和栈。',7),
      mc('哪个是线程通常各自拥有的执行状态？',['所有全局变量','进程的全部文件','PC、SP 和寄存器上下文','一套完全独立的进程地址空间'],2,'独立上下文使线程能够作为执行流被单独调度。',13),
      mc('M:1 用户级线程模型中，承载实体执行阻塞系统调用后可能怎样？',['整组用户线程暂时停住','自动新增十个 CPU','所有线程立刻并行','阻塞只影响另一个进程'],0,'多个用户线程共用一个内核实体；该实体阻塞，整组都可能无法继续。',20),
      mc('单核上交错执行多个任务，最准确的描述是？',['只能叫串行，绝不并发','必然多核并行','并发，但不必物理并行','一定已经死锁'],2,'并发指一段时间内多个任务推进；并行指同一时刻实际同时执行。',29),
      tf('调用普通函数，就创建了一个可独立调度的新线程。',false,'函数调用通常只在当前线程中创建调用帧，没有增加独立调度实体。',11),
      tf('内核级线程的应用业务代码必须始终运行在内核态。',false,'内核级表示对内核可见、可调度，不意味着业务代码只能在内核态。',18),
      tf('一对一线程模型可以把同一进程的多个线程调度到不同 CPU 核上。',true,'各线程分别对应内核调度实体，在硬件资源允许时可并行。',18),
      tf('因为线程拥有各自的栈，其他同进程线程从硬件上绝对无法访问它。',false,'线程共享地址空间；不同栈不是不同保护域，还要考虑指针和对象生命周期。',7),
      fill('线程控制块的英文缩写是 ____。',['TCB'],'Thread Control Block 关联线程状态、寄存器上下文和栈等信息。',13),
      fill('pthread 中等待指定线程结束的函数是 ____。',['pthread_join','pthread_join()'],'join 等待目标线程退出，不是让固定一组线程反复会合的屏障。',14),
      fill('Linux 常见 pthread 模型中，一个用户线程对应一个内核实体，称为 ____ 映射（用数字比例）。',['1:1','1：1','一对一'],'一对一模型支持内核分别调度这些线程。',22),
      fill('复习提纲拓展：串行比例为 20%，使用 4 核，忽略开销的 Amdahl 加速比上限是 ____。',['2.5','2.5倍'],'1 / (0.2 + 0.8/4) = 2.5。并行部分加速后，串行部分仍限制收益。',34)
    ],
    [
      mc('三个作业同时到达，执行时间为 24、3、3，FCFS 按此顺序运行，平均周转时间是？',['17','10','27','30'],2,'完成时刻为 24、27、30，平均周转时间为 (24+27+30)/3=27。',12),
      mc('课件 RR 例题：53、8、68、24，时间片20，同时到达，平均等待时间是？',['24','66.25','104.5','153'],1,'等待时间为 72、20、85、88，平均为 66.25；24 是平均首次响应时间。',18),

      mc('高优先级任务等低优先级持锁者，中优先级任务又阻碍后者运行，适合用什么缓解？',['无限降低所有优先级','删除时间片','优先级继承','增加随机等待'],2,'临时提升持锁者的优先级，使其尽快运行并释放锁。',22),
      tf('一个任务的响应时间，永远等于它全部就绪等待时间之和。',false,'响应时间通常只到首次获得服务；等待时间可跨多次就绪排队累计。',9),
      tf('RR 时间片越小，所有指标和吞吐率都一定越好。',false,'小时间片有利于较快响应，但会增加上下文切换开销，不能保证所有指标都改善。',19),
      tf('EDF 总是选择剩余执行时间最短的任务。',false,'EDF 根据绝对截止时间排序，不是剩余执行时间。',31),
      tf('MLFQ 中任务可以根据历史行为在不同优先级队列之间移动。',true,'反馈的关键是动态调整，常见规则包括用完配额降级、等待过久提升。',23),

      fill('时间片轮转调度的常见英文缩写是 ____。',['RR'],'Round Robin 按时间片轮流让就绪任务使用 CPU。',17),

  function wrongView(){const ids=E.wrongIds(state),list=ids.map(id=>E.byId.get(id)).filter(q=>filter==='all'||String(q.chapter)===filter);return `<section class="wide-view"><div class="view-intro"><span class="eyebrow">GROW THROUGH MISTAKES</span><h2>失误，是下一次命中的开始。</h2><p>连续答对两次，错题就会从待复习列表移出。修炼中答对获 10 EXP，不受伤害。</p><button class="primary small-primary" data-do="review" ${!ids.length?'disabled':''}>${icon('repeat',18)} 开始错题修炼 · ${ids.length} 题</button></div><div class="filter-row"><label for="wrong-filter">筛选章节</label><select id="wrong-filter"><option value="all">全部章节</option>${chapters.map(c=>`<option value="${c.id}" ${filter===String(c.id)?'selected':''}>${c.name}</option>`).join('')}</select><span>${list.length} 道待巩固</span></div><div class="study-list">${list.length?list.map(q=>`<article class="study-item"><span class="study-tag">${chapters[q.chapter].topic} · 错 ${state.records[q.id].wrong} 次 · 连对 ${state.records[q.id].streak}/2</span><h3>${esc(q.prompt)}</h3><details><summary>查看答案与解析</summary><p><b>答案：</b>${esc(q.type==='choice'?q.options[Number(q.answer)]:q.type==='boolean'?(q.answer==='true'?'正确':'错误'):q.answer)}</p><p>${esc(q.explanation)}</p><a href="${SOURCE_ROOT}${encodeURIComponent(q.file)}#page=${q.page}" target="_blank" rel="noopener">原课件第 ${q.page} 页 ↗</a></details></article>`).join(''):`<div class="empty-state">${icon('leaf',44)}<h3>${ids.length?'这个章节暂无错题':'还没有待巩固的错题'}</h3><p>去远征中挑战自己，答错的知识会在这里等待重逢。</p><button class="text-button" data-view="battle">返回战斗 →</button></div>`}</div></section>`;}
  function library(){const list=questions.filter(q=>q.chapter===libraryChapter),ma=E.mastery(state,libraryChapter);return `<section class="wide-view"><div class="view-intro"><span class="eyebrow">CODEX OF KNOWLEDGE</span><h2>你的知识图鉴</h2><p>96 道原创复习题 · 8 个模块 · 每道题都有解析与课件定位。连续答对两次记为已巩固。</p></div><div class="library-tabs">${chapters.map(c=>`<button data-library="${c.id}" class="${libraryChapter===c.id?'active':''}">${c.topic}</button>`).join('')}</div><div class="library-summary"><b>${chapters[libraryChapter].name}</b><span>已接触 ${ma.seen}/${ma.total} · 已巩固 ${ma.learned}/${ma.total}</span></div><div class="study-list">${list.map(q=>`<article class="study-item"><span class="study-tag">${q.type==='choice'?'选择':q.type==='boolean'?'判断':'填空'} · ${(state.records[q.id]?.streak||0)>=2?'已巩固':'待探索'}</span><h3>${esc(q.prompt)}</h3><details><summary>展开答案与解析</summary><p><b>答案：</b>${esc(q.type==='choice'?q.options[Number(q.answer)]:q.type==='boolean'?(q.answer==='true'?'正确':'错误'):q.answer)}</p><p>${esc(q.explanation)}</p><a href="${SOURCE_ROOT}${encodeURIComponent(q.file)}#page=${q.page}" target="_blank" rel="noopener">${esc(q.file)} · 第 ${q.page} 页 ↗</a></details></article>`).join('')}</div></section>`;}
  function render(){if(renderedQuestionId!==state.questionId){selected=null;fillDraft='';renderedQuestionId=state.questionId;}const c=chapters[state.chapter];root.innerHTML=`<div class="app-shell"><header class="site-header"><a class="brand" href="#" data-view="battle"><span class="brand-icon">${icon('leaf',25)}</span><span>内核远征<small>KERNEL QUEST</small></span></a><nav aria-label="主导航">${[['battle','sword','远征'],['map','map','世界地图'],['wrong','repeat','错题本'],['library','book','知识图鉴']].map(([id,ico,label])=>`<button data-view="${id}" class="nav-link ${view===id?'active':''}" ${view===id?'aria-current="page"':''}>${icon(ico,17)}${label}${id==='wrong'&&E.wrongIds(state).length?`<span class="nav-count">${E.wrongIds(state).length}</span>`:''}</button>`).join('')}</nav><div class="header-tools"><span class="saved-state"><i class="live-dot"></i>${storageOK?'本地存档':'临时游玩'}</span><button class="icon-button ${state.sound?'sound-on':''}" data-do="sound" aria-label="${state.sound?'关闭':'开启'}音效" aria-pressed="${state.sound}">${icon('sound')}</button><button class="icon-button" data-do="help" aria-label="游戏玩法">${icon('help')}</button></div></header><main><div class="page-heading"><div><div class="breadcrumb"><span>CHAPTER ${String(state.chapter+1).padStart(2,'0')}</span><i>/</i>${c.name}</div><h1>${view==='battle'?'以知识为剑，向未知进发。':view==='map'?'远征地图':view==='wrong'?'错题回响':'知识图鉴'}</h1></div><div class="chapter-pips" aria-label="已通关 ${state.completed.length} / 8 章">${chapters.map(ch=>`<i class="${state.completed.includes(ch.id)?'done':ch.id===state.chapter?'here':''}"></i>`).join('')}<span>${state.completed.length} / 8</span></div></div>${view==='battle'?`<div class="game-layout">${hud()}${battle()}${question()}</div>`:view==='map'?mapView():view==='wrong'?wrongView():library()}<footer class="site-footer"><span>${icon('leaf',13)} 学一点，再向前一步。</span><a href="https://github.com/zxymao/Chatgpt/blob/main/OS-course/复习资料/操作系统期中复习提纲.pdf" target="_blank" rel="noopener">打开期中复习提纲 ↗</a><span>选择 · 判断 · 填空 / 进度仅保存在当前浏览器</span></footer></main></div>`;updateSubmit();}
  function updateSubmit(){const btn=document.getElementById('submit-answer');if(btn)btn.disabled=state.phase!=='question'||(E.byId.get(state.questionId)?.type==='fill'?!document.getElementById('fill-answer')?.value.trim():selected===null);}
  function submit(){const q=E.byId.get(state.questionId);if(!q||state.phase!=='question')return;const input=q.type==='fill'?document.getElementById('fill-answer')?.value:selected;if(input===null||input===undefined)return;const result=E.answer(state,input);if(!result)return;save();beep(result.correct);selected=null;render();document.querySelector('.next-button')?.focus({preventScroll:true});}
  function exportSave(){save();const a=document.createElement('a');const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.href=url;a.download='内核远征-存档.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500);toast('存档已导出，请妥善保存。');}
  function requireReady(){if(state.phase==='feedback'){toast('先点击“下一回合”，完成这一回合的结算。');return false;}return true;}
  document.addEventListener('click',event=>{
    const el=event.target.closest('button,a');if(!el)return;
    if(el.dataset.view){event.preventDefault();view=el.dataset.view;render();return;}
    if(el.hasAttribute('data-answer')){selected=el.dataset.answer;document.querySelectorAll('.option').forEach(b=>{b.classList.toggle('selected',b.dataset.answer===selected);b.setAttribute('aria-pressed',String(b.dataset.answer===selected));});updateSubmit();return;}
    if(el.dataset.action){if(E.setAction(state,el.dataset.action)){save();render();}return;}
    if(el.hasAttribute('data-chapter')){if(!requireReady())return;if(E.travel(state,Number(el.dataset.chapter))){view='battle';selected=null;save();render();}return;}
    if(el.hasAttribute('data-library')){libraryChapter=Number(el.dataset.library);render();return;}
    switch(el.dataset.do){
      case 'answer':submit();break;
      case 'next':if(E.advance(state)){selected=null;save();render();document.getElementById('fill-answer')?.focus({preventScroll:true});}break;
      case 'rest':if(!requireReady())return;showDialog('在营地休整',`<p>恢复全部生命与 3 点灵感，当前敌人也会恢复全部生命。等级、经验、错题和章节解锁会保留。</p><button class="primary" data-do="confirm-rest">休整并重新挑战</button>`);break;
      case 'confirm-rest':E.rest(state);selected=null;dialog.close();save();render();toast('体力恢复了，再出发吧。');break;
      case 'review':if(!requireReady())return;if(E.review(state)){view='battle';selected=null;save();render();}else toast('目前没有待复习的错题。');break;
      case 'return':case 'continue':E.travel(state,state.chapter);view='battle';selected=null;save();render();break;
      case 'export':exportSave();break;
      case 'import':document.getElementById('import-file').click();break;
      case 'sound':state.sound=!state.sound;save();render();if(state.sound)beep(true);toast(state.sound?'音效已开启':'音效已关闭');break;
      case 'close-dialog':dialog.close();break;
      case 'rename':showDialog('你的冒险者名字',`<form id="rename-form"><label for="hero-name">最多 16 个字符</label><input id="hero-name" maxlength="16" value="${esc(state.name)}" required><button class="primary" type="submit">保存名字</button></form>`);break;
      case 'help':showDialog('知识，就是你的战斗力。',`<div class="help-copy"><p><b>01 · 选招式，答题出击</b><br>右侧回答选择、判断或填空题。答对才发动招式并获得经验；答错后敌人会反击，解析会帮你补上知识。</p><p><b>02 · 成长与远征</b><br>升级自动增加攻击、防御和生命上限。普通攻击恢复灵感，灵感爆发与稳固壁垒消耗灵感。每章击败两个怪物和一个首领，解锁下一章。</p><p><b>03 · 从错题中成长</b><br>错题本里可以进行无伤修炼，答对获 10 EXP。连续答对两次，移出待复习列表。知识图鉴可直接查阅所有题目。</p><p><b>04 · 休整和存档</b><br>战败保留等级与知识记录。可在营地重新挑战；进度保存在当前浏览器，导出/导入可迁移存档。</p><p class="muted">快捷键：1–4 选择答案，Enter 确认；填空题输入后按 Enter。无时间限制，慢慢思考。</p></div>`);break;
    }
  });
  document.addEventListener('input',e=>{if(e.target.id==='fill-answer'){fillDraft=e.target.value;updateSubmit();}});
  document.addEventListener('change',e=>{if(e.target.id==='wrong-filter'){filter=e.target.value;render();}});
  document.addEventListener('submit',e=>{if(e.target.id==='rename-form'){e.preventDefault();state.name=document.getElementById('hero-name').value.trim().slice(0,16)||'见习守护者';save();dialog.close();render();}});
  document.addEventListener('keydown',e=>{
    if(dialog.open||view!=='battle'||e.ctrlKey||e.metaKey||e.altKey)return;
    if(e.key==='Enter'&&(document.activeElement.matches('.option,#fill-answer')||!['BUTTON','A','SUMMARY'].includes(document.activeElement.tagName))){e.preventDefault();if(state.phase==='feedback')document.querySelector('[data-do="next"]')?.click();else submit();}
    if(/^[1-4]$/.test(e.key)&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){const btn=document.querySelectorAll('.option')[Number(e.key)-1];if(btn&&!btn.disabled){e.preventDefault();btn.click();btn.focus({preventScroll:true});}}
  });
  document.getElementById('import-file').addEventListener('change',async e=>{
    const file=e.target.files[0];e.target.value='';if(!file)return;if(file.size>500000){toast('文件过大，请选择游戏导出的 JSON 存档。');return;}
    let restored;try{restored=E.restore(await file.text());}catch{}if(!restored){toast('存档无效或版本不兼容，当前进度未改变。');return;}
    showDialog('载入这份存档？',`<p>角色：${esc(restored.name)} · Lv.${restored.level}<br>章节：${chapters[restored.chapter].name}</p><p>将替换当前浏览器的进度。建议先导出当前存档备份。</p><button class="primary" id="confirm-import">确认载入</button>`);
    document.getElementById('confirm-import').addEventListener('click',()=>{state=restored;E.prepare(state);view='battle';selected=null;save();dialog.close();render();toast('存档已载入。');},{once:true});
  });
  save();render();
  if(!storageOK)toast('浏览器限制了存档，请在离开前导出进度。');
  else if(loaded&&state.phase==='feedback')toast('已恢复上一回合，请先查看结算。');
})();
</script>
</body>
</html>
