name: Deploy OS Quest to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'OS-course/os-quest/**'
      - 'os-lab/game/**'
      - '.github/workflows/deploy-os-quest.yml'

permissions:
  contents: read

concurrency:
  group: os-quest-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test game rules and question bank
        working-directory: OS-course/os-quest
        run: npm test
      - name: Test pet workshop rules and build
        run: |
          node --test os-lab/game/tests/engine.test.cjs
          node os-lab/game/build.mjs --check
      - name: Build the standalone game
        run: |
          node OS-course/os-quest/build.mjs
          mkdir -p _site
          cp OS-course/os-quest/index.html _site/index.html
          mkdir -p _site/pet-kernel
          cp os-lab/game/index.html _site/pet-kernel/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
